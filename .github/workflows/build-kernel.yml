name: Build DroidSpaces Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git cpio zip unzip

    - name: Clone kernel
      run: |
        git clone --depth=1 https://github.com/maverickjb/linux-6.1.10.git kernel
        echo "Kernel source ready"
        head -5 kernel/Makefile

    - name: Apply config
      run: |
        cd kernel
        cp ../arch/arm64/configs/xiaomi_nabu_droidspace_defconfig arch/arm64/configs/
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- xiaomi_nabu_droidspace_defconfig
        echo "Config applied"
        grep -E "CONFIG_NAMESPACES|CONFIG_PID_NS|CONFIG_CGROUPS" .config || true

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image modules dtbs 2>&1 | tee ../build.log
        ls -lh arch/arm64/boot/Image

    - name: Package
      run: |
        cd kernel
        mkdir -p ../out
        cp arch/arm64/boot/Image ../out/
        find arch/arm64/boot/dts -name "*sm8150*.dtb" -exec cp {} ../out/ \; 2>/dev/null || true
        
        mkdir -p ../release
        cp ../out/Image ../release/
        cp ../out/*.dtb ../release/ 2>/dev/null || true
        cd ../release && zip -r ../DroidSpaces_nabu.zip .
        echo "Package created"
        ls -lh ../DroidSpaces_nabu.zip

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: droidspaces-kernel-nabu
        path: |
          out/
          release/
          build.log
        retention-days: 30