name: Build DroidSpaces Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git cpio zip unzip lz4 xz-utils device-tree-compiler libncurses-dev python3
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone kernel
        run: |
          git clone --depth=1 -b HyperOS1 https://github.com/Kuugo2002/xiaomi_kernel_nabu.git kernel
          head -5 kernel/Makefile
          ls kernel/arch/arm64/configs/ | head -20

      - name: Apply config
        run: |
          cd kernel
          # 用内核自带的 nabu defconfig 作为基底（4.14 源码自洽）
          BASE=$(ls arch/arm64/configs/ | grep -iE '^nabu.*defconfig$' | head -1)
          if [ -z "$BASE" ]; then
            BASE=$(ls arch/arm64/configs/ | grep -iE 'sm8150.*defconfig$' | head -1)
          fi
          echo "Base defconfig: $BASE"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$BASE"

          # 只追加 DroidSpaces 需要的选项，不整份替换
          cat >> .config << 'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_NET_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_MEMCG=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF
          sed -i 's/^          //' .config

          # 让 Kconfig 解析依赖，自动处理冲突项
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== DroidSpaces config verification ==="
          for c in CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS \
                   CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_DEVTMPFS \
                   CONFIG_OVERLAY_FS CONFIG_SECCOMP CONFIG_VETH CONFIG_BRIDGE; do
            if grep -q "^${c}=y" .config; then echo "OK   ${c}"; else echo "MISS ${c}"; fi
          done

      - name: Patch tracepoint include paths (global)
        run: |
          cd kernel
          # 高通 4.14 BSP 里多处 *-trace.c 通过 define_trace.h 反向 include
          # 自己的 *-trace.h，但对应 Makefile 没给该目标加 -I$(src)，
          # TRACE_INCLUDE 解析失败。逐个补会没完 —— 全局扫描处理。
          #
          # 做法：找出所有定义了 TRACE_INCLUDE_FILE / CREATE_TRACE_POINTS 的
          # 目录，给该目录 Makefile 追加 ccflags-y += -I$(src)。
          patched=0
          for f in $(grep -rl "CREATE_TRACE_POINTS" --include="*.c" drivers/ techpack/ 2>/dev/null); do
            d=$(dirname "$f")
            mk="$d/Makefile"
            [ -f "$mk" ] || continue
            grep -q 'ccflags-y += -I$(src)' "$mk" && continue
            printf '\nccflags-y += -I$(src)\n' >> "$mk"
            echo "  patched $mk"
            patched=$((patched+1))
          done
          echo "Patched $patched Makefiles for tracepoint include resolution"

          # 高通相机子系统内部跨目录 include 极多（cam_context.h、
          # cam_ife_hw_mgr.h、cam_isp_packet_parser.h ...），逐个列目录必然漏。
          # 机械且完备的做法：把相机树下所有含 .h 的目录全部加入搜索路径，
          # 写进根 Makefile 的 subdir-ccflags-y 以向所有子目录传播。
          cam="drivers/media/platform/msm/camera"
          if [ -d "$cam" ] && [ -f "$cam/Makefile" ]; then
            if ! grep -q 'DROIDSPACES_CAM_INC' "$cam/Makefile"; then
              {
                echo ""
                echo "# DROIDSPACES_CAM_INC"
                find "$cam" -type d | while read -r d; do
                  ls "$d"/*.h >/dev/null 2>&1 && \
                    echo "subdir-ccflags-y += -I\$(srctree)/$d"
                done
              } >> "$cam/Makefile"
              n=$(grep -c 'subdir-ccflags-y += -I' "$cam/Makefile")
              echo "Patched camera root Makefile with $n header dirs"
            fi
          fi

          # 同理处理其它已知内部 include 密集的 msm 子系统
          for sub in drivers/media/platform/msm/vidc drivers/media/platform/msm/sde; do
            [ -d "$sub" ] && [ -f "$sub/Makefile" ] || continue
            grep -q 'DROIDSPACES_SUB_INC' "$sub/Makefile" && continue
            {
              echo ""
              echo "# DROIDSPACES_SUB_INC"
              find "$sub" -type d | while read -r d; do
                ls "$d"/*.h >/dev/null 2>&1 && \
                  echo "subdir-ccflags-y += -I\$(srctree)/$d"
              done
            } >> "$sub/Makefile"
            echo "Patched $sub with header dirs"
          done

      - name: Build kernel
        run: |
          cd kernel
          # 4.14 源码用现代 GCC 13 编译会触发大量新增警告，
          # 而内核 Makefile 带 -Werror，需要放宽为非致命。
          KCFLAGS="-Wno-error \
            -Wno-error=misleading-indentation \
            -Wno-error=designated-init \
            -Wno-error=array-bounds \
            -Wno-error=stringop-overflow \
            -Wno-error=stringop-truncation \
            -Wno-error=maybe-uninitialized \
            -Wno-error=dangling-pointer \
            -Wno-error=enum-conversion \
            -Wno-error=address \
            -Wno-error=unused-variable \
            -Wno-error=unused-but-set-variable \
            -Wno-error=implicit-fallthrough \
            -Wno-error=packed-not-aligned \
            -Wno-error=attributes \
            -Wno-error=format-overflow \
            -Wno-error=format-truncation \
            -Wno-error=restrict \
            -Wno-error=nonnull \
            -Wno-error=memset-elt-size \
            -Wno-error=sizeof-pointer-memaccess \
            -Wno-error=pointer-sign \
            -Wno-error=incompatible-pointer-types \
            -Wno-error=int-conversion \
            -Wno-error=discarded-qualifiers \
            -Wno-error=return-type"

          set -o pipefail
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="$KCFLAGS" \
            CONFIG_WERROR=n \
            Image modules dtbs 2>&1 | tee ../build.log || {
              echo "=== BUILD FAILED ==="
              echo "--- unique errors ---"
              grep -iE "error:|fatal error:" ../build.log | sort -u | head -25
              echo "--- failed objects ---"
              grep -E "^make.*\*\*\*.*Error" ../build.log | head -15
              exit 1
            }

          echo "=== Build result ==="
          ls -lh arch/arm64/boot/Image

      - name: Collect kernel output
        run: |
          mkdir -p out
          cp kernel/arch/arm64/boot/Image out/
          find kernel/arch/arm64/boot/dts -name "*nabu*.dtb" -exec cp {} out/ \; 2>/dev/null || true
          find kernel/arch/arm64/boot/dts -name "*sm8150*.dtb" -exec cp {} out/ \; 2>/dev/null || true
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=../out/modules modules_install || true
          cd ..
          echo "=== kernel output ==="
          ls -lh out/
          echo "dtb count: $(ls out/*.dtb 2>/dev/null | wc -l)"

      - name: Build AnyKernel3 flashable zip
        run: |
          # AnyKernel3 在设备上就地替换 boot 分区里的内核，
          # 复用设备自身的 ramdisk —— 因此无需 stock boot.img 即可产出
          # 可刷入的成品，这是本项目的主交付物。
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          rm -f ak3/modules/system/lib/modules/placeholder 2>/dev/null || true

          cp out/Image ak3/Image
          for d in out/*.dtb; do [ -f "$d" ] && cp "$d" ak3/dtb 2>/dev/null && break; done

          # 内核模块随包安装到 vendor
          if [ -d out/modules/lib/modules ]; then
            mkdir -p ak3/modules/vendor/lib/modules
            find out/modules/lib/modules -name "*.ko" \
              -exec cp {} ak3/modules/vendor/lib/modules/ \; 2>/dev/null || true
            echo "bundled $(ls ak3/modules/vendor/lib/modules/*.ko 2>/dev/null | wc -l) modules"
          fi

          # nabu 专用 anykernel.sh（heredoc 内容必须保持缩进，
          # 否则会 dedent 出 YAML 块标量导致解析失败）
          cat > ak3/anykernel.sh << 'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## DroidSpaces Kernel - Xiaomi Pad 5 (nabu)
          properties() { '
          kernel.string=DroidSpaces Kernel for Xiaomi Pad 5 (nabu)
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=nabu
          device.name2=Xiaomi Pad 5
          device.name3=21051182C
          device.name4=21051182G
          device.name5=21051182I
          supported.versions=
          supported.patchlevels=
          '; } # end properties
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK3
          # 去掉写入时带上的 10 空格缩进，还原为合法脚本
          sed -i 's/^          //' ak3/anykernel.sh
          echo "=== anykernel.sh ==="
          cat ak3/anykernel.sh

          cd ak3
          zip -r9 ../DroidSpaces_nabu_AnyKernel3.zip * -x .git
          cd ..
          echo "=== AnyKernel3 zip ==="
          ls -lh DroidSpaces_nabu_AnyKernel3.zip
          unzip -l DroidSpaces_nabu_AnyKernel3.zip | tail -5

      - name: Build boot.img
        run: |
          # 若仓库提供了 stock boot.img（HyperOS 1.0.3.0TKXCNXM 抽取），
          # 则用其 ramdisk 直接合成 boot.img；否则说明原因并跳过。
          sudo apt-get install -y android-sdk-libsparse-utils abootimg 2>/dev/null || true
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg-tools 2>/dev/null || true

          STOCK=""
          for c in stock/boot.img stock_boot.img prebuilt/boot.img; do
            [ -f "$c" ] && STOCK="$c" && break
          done

          if [ -z "$STOCK" ]; then
            echo "::notice::No stock boot.img in repo -> boot.img not synthesized."
            echo "AnyKernel3 zip is the flashable deliverable (it patches boot in-place"
            echo "and reuses the device ramdisk, so it needs no stock image)."
            echo ""
            echo "To also get a raw boot.img, commit the stock one to stock/boot.img:"
            echo "  adb shell su -c 'dd if=/dev/block/bootdevice/by-name/boot of=/sdcard/boot.img'"
            echo "  adb pull /sdcard/boot.img stock/boot.img"
            exit 0
          fi

          echo "Found stock boot.img: $STOCK"
          python3 mkbootimg-tools/unpack_bootimg.py \
            --boot_img "$STOCK" --out unpacked | tee unpack.txt

          PAGESIZE=$(grep -oP 'page size:\s*\K[0-9]+' unpack.txt | head -1); PAGESIZE=${PAGESIZE:-4096}
          HDRV=$(grep -oP 'boot image header version:\s*\K[0-9]+' unpack.txt | head -1); HDRV=${HDRV:-2}
          OSVER=$(grep -oP 'os version:\s*\K[0-9.]+' unpack.txt | head -1); OSVER=${OSVER:-13.0.0}
          OSPL=$(grep -oP 'os patch level:\s*\K[0-9-]+' unpack.txt | head -1); OSPL=${OSPL:-2024-01}
          CMDLINE=$(grep -oP 'command line args:\s*\K.*' unpack.txt | head -1)

          ARGS="--kernel out/Image --ramdisk unpacked/ramdisk --header_version $HDRV --pagesize $PAGESIZE --os_version $OSVER --os_patch_level $OSPL"
          [ -n "$CMDLINE" ] && ARGS="$ARGS --cmdline \"$CMDLINE\""
          [ -f unpacked/dtb ] && ARGS="$ARGS --dtb unpacked/dtb"

          eval python3 mkbootimg-tools/mkbootimg.py $ARGS -o out/boot.img
          echo "=== boot.img ==="
          ls -lh out/boot.img

      - name: Build summary
        run: |
          echo "## DroidSpaces Kernel Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Device: Xiaomi Pad 5 (nabu) | Target: HyperOS 1.0.3.0TKXCNXM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          [ -f DroidSpaces_nabu_AnyKernel3.zip ] && \
            echo "| DroidSpaces_nabu_AnyKernel3.zip | $(du -h DroidSpaces_nabu_AnyKernel3.zip | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          [ -f out/boot.img ] && \
            echo "| boot.img | $(du -h out/boot.img | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          [ -f out/Image ] && \
            echo "| Image | $(du -h out/Image | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Flash via TWRP: push the AnyKernel3 zip to /sdcard and install it." >> $GITHUB_STEP_SUMMARY

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidspaces-kernel-nabu
          path: |
            DroidSpaces_nabu_AnyKernel3.zip
            out/boot.img
            out/Image
            out/*.dtb
            build.log
          retention-days: 30
          if-no-files-found: warn
