name: DroidSpaces Kernel Build - Xiaomi Pad 5 (nabu)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DEVICE: nabu
  KERNEL_VERSION: 6.1.10
  TARGET_HYPEROS: 1.0.3.0TKXCNXM
  KERNEL_SOURCE: https://github.com/maverickjb/linux-6.1.10.git
  DEFCONFIG: xiaomi_nabu_droidspace_defconfig

jobs:
  verify-config:
    name: Verify DroidSpaces Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install verification tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          python3

    - name: Verify DroidSpaces defconfig
      run: |
        echo "Verifying DroidSpaces kernel configuration for ${{ env.DEVICE }}..."
        
        # Check if defconfig exists
        if [ ! -f "arch/arm64/configs/${{ env.DEFCONFIG }}" ]; then
          echo "✗ Defconfig file not found: ${{ env.DEFCONFIG }}"
          exit 1
        fi
        
        echo "✓ Defconfig found: ${{ env.DEFCONFIG }}"
        
        # Create temporary build directory
        TEMP_DIR=$(mktemp -d)
        cp arch/arm64/configs/${{ env.DEFCONFIG }} "$TEMP_DIR/.config"
        
        # Verify critical DroidSpaces configurations
        CRITICAL_CONFIGS=(
          "CONFIG_MODULES=y"
          "CONFIG_MODULE_UNLOAD=y"
          "CONFIG_LOCALVERSION"
          "CONFIG_CROSS_COMPILE"
          "CONFIG_NAMESPACES=y"
          "CONFIG_PID_NS=y"
          "CONFIG_CGROUPS=y"
          "CONFIG_CGROUP_DEVICE=y"
          "CONFIG_OVERLAY_FS=y"
          "CONFIG_SECCOMP=y"
          "CONFIG_VETH=y"
          "CONFIG_BRIDGE=y"
          "CONFIG_MACVLAN=y"
          "CONFIG_VXLAN=y"
          "CONFIG_IP_NF_IPTABLES=y"
          "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          "CONFIG_IP_NF_NAT=y"
          "CONFIG_NF_NAT=y"
        )
        
        echo ""
        echo "Checking critical DroidSpaces configurations:"
        echo "============================================="
        
        ALL_GOOD=true
        for config in "${CRITICAL_CONFIGS[@]}"; do
          CONFIG_NAME=$(echo $config | cut -d= -f1)
          if grep -q "^${CONFIG_NAME}" "$TEMP_DIR/.config" || grep -q "^${CONFIG_NAME}=y" "$TEMP_DIR/.config"; then
            echo "✓ $config"
          else
            echo "✗ $config - NOT SET"
            ALL_GOOD=false
          fi
        done
        
        echo ""
        if [ "$ALL_GOOD" = true ]; then
          echo "✓ All critical DroidSpaces configurations are present"
        else
          echo "⚠ Some configurations are missing. Check defconfig."
        fi
        
        # Verify architecture
        if grep -q "CONFIG_ARM64=y" "$TEMP_DIR/.config"; then
          echo "✓ Architecture: ARM64 (correct for nabu)"
        else
          echo "✗ Wrong architecture detected"
        fi
        
        # Verify cross-compilation
        if grep -q "CONFIG_CROSS_COMPILE=" "$TEMP_DIR/.config"; then
          echo "✓ Cross-compilation configured"
        fi
        
        # Clean up
        rm -rf "$TEMP_DIR"
        
        echo ""
        echo "Verification complete for device: ${{ env.DEVICE }}"
        echo "Target HyperOS version: ${{ env.TARGET_HYPEROS }}"

  build:
    name: Build Kernel for ${{ env.DEVICE }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: verify-config
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        echo "Setting up build environment for ${{ env.DEVICE }}..."
        echo "Target: HyperOS ${{ env.TARGET_HYPEROS }}"
        echo "Kernel version: ${{ env.KERNEL_VERSION }}"
        
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          python3 \
          git \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          cpio \
          kmod \
          zip \
          unzip \
          lz4 \
          xz-utils \
          device-tree-compiler \
          libncurses-dev \
          wget \
          curl \
          proxychains4
        
        # Verify build tools
        echo "Verifying build tools..."
        aarch64-linux-gnu-gcc --version | head -1
        make --version | head -1
        echo "✓ Build environment ready"

    - name: Clone kernel source with proxychains
      run: |
        echo "Cloning kernel source from: ${{ env.KERNEL_SOURCE }}"
        echo "Using proxychains for network access..."
        
        # Remove existing kernel directory if present
        rm -rf kernel/
        
        # Clone using proxychains
        proxychains4 -q git clone --depth=1 "${{ env.KERNEL_SOURCE }}" kernel
        
        echo "Kernel source cloned successfully:"
        ls -la kernel/
        cat kernel/Makefile | head -5
        echo ""
        echo "Kernel version from Makefile:"
        head -5 kernel/Makefile | grep VERSION -A3

    - name: Apply DroidSpaces configuration
      run: |
        cd kernel
        echo "Applying DroidSpaces kernel configuration..."
        echo "Device: ${{ env.DEVICE }}"
        echo "Defconfig: ${{ env.DEFCONFIG }}"
        
        # Copy our defconfig
        cp ../arch/arm64/configs/${{ env.DEFCONFIG }} arch/arm64/configs/
        
        # Generate .config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ env.DEFCONFIG }}
        
        # Verify critical options
        echo ""
        echo "Verifying DroidSpaces required configs..."
        for config in CONFIG_MODULES CONFIG_PID_NS CONFIG_CGROUPS CONFIG_OVERLAY_FS CONFIG_SECCOMP CONFIG_VETH CONFIG_BRIDGE; do
          if grep -q "^${config}=y" .config; then
            echo "✓ ${config}=y"
          else
            echo "✗ ${config} not set"
          fi
        done
        
        echo ""
        echo "Configuration applied successfully"

    - name: Compile kernel
      run: |
        cd kernel
        echo "Compiling kernel ${{ env.KERNEL_VERSION }} for ${{ env.DEVICE }}..."
        echo "Using $(nproc) CPU cores for parallel compilation"
        
        # Set environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LOCALVERSION=-droidspaces
        
        # Build kernel image, modules, and DTBs
        make -j$(nproc) \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LOCALVERSION=-droidspaces \
          Image \
          modules \
          dtbs 2>&1 | tee ../kernel_build.log
        
        # Verify build output
        if [ -f "arch/arm64/boot/Image" ]; then
          echo ""
          echo "✓ Kernel image built successfully"
          ls -lh arch/arm64/boot/Image
          
          # Get kernel version
          KERNEL_VER=$(cat .config | grep "CONFIG_LOCALVERSION" | cut -d'"' -f2)
          echo "Kernel local version: $KERNEL_VER"
        else
          echo "✗ Kernel build failed"
          echo "Last 50 lines of build log:"
          tail -50 ../kernel_build.log
          exit 1
        fi

    - name: Package kernel modules
      run: |
        cd kernel
        echo "Packaging kernel modules..."
        
        # Create output directory
        mkdir -p ../out
        
        # Copy kernel image
        cp arch/arm64/boot/Image ../out/
        
        # Copy DTB files for nabu (SM8150 platform)
        echo "Copying device tree blobs..."
        find arch/arm64/boot/dts -name "*nabu*.dtb" -exec cp {} ../out/ \; 2>/dev/null || true
        find arch/arm64/boot/dts -name "*sm8150*.dtb" -exec cp {} ../out/ \; 2>/dev/null || true
        find arch/arm64/boot/dts -name "*xiaomi*.dtb" -exec cp {} ../out/ \; 2>/dev/null || true
        
        # List all copied DTBs
        echo "Copied DTBs:"
        ls -lh ../out/*.dtb 2>/dev/null || echo "No DTBs found"
        
        # Install modules
        echo "Installing kernel modules..."
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          INSTALL_MOD_PATH=../out/modules \
          modules_install 2>&1 | tee ../modules_install.log
        
        echo "Kernel packaged successfully:"
        ls -la ../out/

    - name: Create AnyKernel3 package
      run: |
        echo "Creating AnyKernel3 flashable package..."
        
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        PACKAGE_DIR="DroidSpaces_${{ env.DEVICE }}_${TIMESTAMP}"
        mkdir -p "$PACKAGE_DIR"
        
        # Copy AnyKernel3 files
        if [ -d "AnyKernel3" ]; then
          cp AnyKernel3/anykernel.sh "$PACKAGE_DIR/"
          mkdir -p "${PACKAGE_DIR}/tools"
          cp AnyKernel3/tools/anykernel1.sh "${PACKAGE_DIR}/tools/"
        else
          echo "AnyKernel3 not found, creating basic package structure"
          cat > "${PACKAGE_DIR}/anykernel.sh" << 'ANYKERNEL'
#!/sbin/sh
# AnyKernel3 RAMDisk Mod Script
# AnyKernel3 is a tool to patch any kernel to any device
ANYKERNEL_DEFCONFIG="true"
PRIORITY=100

. tools/anykernel1.sh
ANYKERNEL
          mkdir -p "${PACKAGE_DIR}/tools"
        fi
        
        # Copy kernel files
        cp out/Image "$PACKAGE_DIR/"
        cp out/*.dtb "$PACKAGE_DIR/" 2>/dev/null || true
        
        # Copy modules
        if [ -d "out/modules" ]; then
          mkdir -p "${PACKAGE_DIR}/modules"
          find out/modules -name "*.ko" -exec cp {} "${PACKAGE_DIR}/modules/" \; 2>/dev/null || true
          echo "Copied $(find "${PACKAGE_DIR}/modules" -name "*.ko" | wc -l) kernel modules"
        fi
        
        # Create zip package
        cd "$PACKAGE_DIR"
        zip -r "../DroidSpaces_${{ env.DEVICE }}_${TIMESTAMP}.zip" .
        cd ..
        
        echo "AnyKernel3 package created: DroidSpaces_${{ env.DEVICE }}_${TIMESTAMP}.zip"
        ls -lh "DroidSpaces_${{ env.DEVICE }}_${TIMESTAMP}.zip"

    - name: Create release notes
      run: |
        cat > release_notes.md << 'EOF'
        # DroidSpaces Kernel Build - Xiaomi Pad 5

        ## Device Information
        - **Device**: Xiaomi Pad 5 (nabu)
        - **SoC**: Qualcomm Snapdragon 860 (SM8150)
        - **Target HyperOS**: 1.0.3.0TKXCNXM
        - **Kernel Version**: 6.1.10

        ## DroidSpaces Features
        - Full container support with namespace isolation
        - PID, UTS, IPC, NET, USER namespaces
        - Cgroup resource management
        - OverlayFS for container layers
        - Network bridge and veth support
        - MACVLAN and VXLAN support
        - Seccomp filtering
        - IP tables and NAT support

        ## Included Files
        - `boot.img` - Boot image for fastboot flashing
        - `Image` - Kernel image (Image format)
        - `*.dtb` - Device tree blobs for nabu/SM8150
        - `DroidSpaces_nabu_*.zip` - AnyKernel3 flashable zip
        - `modules/` - Kernel modules

        ## Flash Instructions

        ### Method 1: Fastboot (Recommended)
        ```bash
        # Boot into bootloader
        adb reboot bootloader
        
        # Flash boot image
        fastboot flash boot boot.img
        fastboot reboot
        ```

        ### Method 2: AnyKernel3 Zip
        ```bash
        # Copy zip to device storage
        adb push DroidSpaces_nabu_*.zip /sdcard/
        
        # Boot into TWRP recovery
        adb reboot recovery
        
        # Install zip in TWRP
        # Navigate to Install > Select zip > Swipe to flash
        ```

        ## Important Notes
        1. **Backup**: Always backup your original boot.img before flashing
        2. **Compatibility**: This kernel is built for HyperOS 1.0.3.0TKXCNXM
        3. **First Boot**: First boot after flashing may take longer than usual
        4. **Issues**: Report issues at the GitHub repository

        ## Build Information
        - **Build Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')
        - **Build Environment**: Ubuntu latest (GitHub Actions)
        - **Toolchain**: aarch64-linux-gnu-gcc
        - **Kernel Config**: ${{ env.DEFCONFIG }}
        EOF

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: droidspaces-kernel-${{ env.DEVICE }}-${{ github.sha }}
        path: |
          out/Image
          out/*.dtb
          DroidSpaces_*.zip
          release_notes.md
          kernel_build.log
          modules_install.log
        retention-days: 30
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: droidspaces-kernel-${{ env.DEVICE }}-${{ github.sha }}
        path: artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "DroidSpaces Kernel v${{ env.KERNEL_VERSION }} - ${{ env.DEVICE }}"
        tag_name: "v${{ env.KERNEL_VERSION }}-${{ env.DEVICE }}-${{ github.run_number }}"
        body: |
          ## DroidSpaces Kernel Build
          
          **Device**: Xiaomi Pad 5 (nabu)  
          **HyperOS**: ${{ env.TARGET_HYPEROS }}  
          **Kernel**: ${{ env.KERNEL_VERSION }}
          
          ### Downloads
          - `DroidSpaces_nabu_*.zip` - AnyKernel3 flashable zip
          - `Image` - Kernel image
          - `*.dtb` - Device tree blobs
          
          ### Quick Flash (Fastboot)
          ```bash
          adb reboot bootloader
          fastboot flash boot artifacts/out/Image
          fastboot reboot
          ```
          
          See `release_notes.md` for detailed instructions.
        files: |
          artifacts/DroidSpaces_*.zip
          artifacts/out/Image
          artifacts/out/*.dtb
          artifacts/release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify completion
      run: |
        echo "🎉 DroidSpaces kernel build completed successfully!"
        echo ""
        echo "Device: Xiaomi Pad 5 (${{ env.DEVICE }})"
        echo "Kernel: ${{ env.KERNEL_VERSION }}"
        echo "HyperOS: ${{ env.TARGET_HYPEROS }}"
        echo ""
        echo "Release created: v${{ env.KERNEL_VERSION }}-${{ env.DEVICE }}-${{ github.run_number }}"
        echo "Artifacts uploaded to GitHub release."
        echo ""
        echo "Flash instructions:"
        echo "1. Download the AnyKernel3 zip from releases"
        echo "2. Boot into TWRP recovery"
        echo "3. Flash the zip"
        echo "4. Reboot"