name: Build DroidSpaces Kernel for Xiaomi Pad 5

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build (e.g., 6.1.10)'
        required: false
        default: '6.1.10'
      defconfig:
        description: 'Defconfig to use'
        required: false
        default: 'xiaomi_nabu_droidspace_defconfig'
      clean_build:
        description: 'Force clean build'
        required: false
        default: 'false'
        type: boolean
      use_cache:
        description: 'Use cached build environment'
        required: false
        default: 'true'
        type: boolean

env:
  DEVICE: nabu
  CODENAME: nabu
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.1.10' }}
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'xiaomi_nabu_droidspace_defconfig' }}
  ARCH: arm64
  SUBARCH: arm64
  TZ: Asia/Shanghai
  # Docker image for reproducible builds
  BUILD_IMAGE: ubuntu:22.04
  # Cache keys
  TOOLCHAIN_CACHE_KEY: toolchain-${{ runner.os }}-aarch64-linux-gnu
  KERNEL_CACHE_KEY: kernel-${{ github.sha }}
  DEPS_CACHE_KEY: deps-${{ runner.os }}-v1

jobs:
  # ============================================
  # Stage 1: Setup and Cache Management
  # ============================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      kernel_source_exists: ${{ steps.check-source.outputs.exists }}
      toolchain_ready: ${{ steps.check-toolchain.outputs.ready }}
      deps_hash: ${{ steps.deps-hash.outputs.hash }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check kernel source cache
      id: check-source
      uses: actions/cache@v4
      with:
        path: kernel-source
        key: kernel-source-${{ env.KERNEL_VERSION }}-${{ hashFiles('arch/arm64/configs/*.defconfig') }}
        restore-keys: |
          kernel-source-${{ env.KERNEL_VERSION }}-
          kernel-source-
    
    - name: Check toolchain cache
      id: check-toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: ${{ env.TOOLCHAIN_CACHE_KEY }}
        restore-keys: |
          toolchain-${{ runner.os }}-
    
    - name: Calculate dependencies hash
      id: deps-hash
      run: |
        # Calculate hash of all dependency files
        cat > /tmp/deps.txt << 'EOF'
        build-essential
        bc
        bison
        flex
        libssl-dev
        libelf-dev
        python3
        python3-pip
        gcc-aarch64-linux-gnu
        binutils-aarch64-linux-gnu
        device-tree-compiler
        EOF
        
        # Add defconfig files
        find arch/arm64/configs -name "*.defconfig" -exec md5sum {} \; >> /tmp/deps.txt 2>/dev/null || true
        
        # Calculate hash
        DEPS_HASH=$(md5sum /tmp/deps.txt | awk '{print $1}')
        echo "hash=$DEPS_HASH" >> $GITHUB_OUTPUT
        echo "Dependencies hash: $DEPS_HASH"

  # ============================================
  # Stage 2: Toolchain Setup (Cached)
  # ============================================
  toolchain:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup toolchain (cached)
      id: setup-toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: ${{ env.TOOLCHAIN_CACHE_KEY }}
        restore-keys: |
          toolchain-${{ runner.os }}-
    
    - name: Install cross-compiler if not cached
      if: steps.setup-toolchain.outputs.cache-hit != 'true'
      run: |
        echo "Installing cross-compiler toolchain..."
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu
        
        # Save toolchain paths
        mkdir -p toolchain
        which aarch64-linux-gnu-gcc > toolchain/gcc-path
        which aarch64-linux-gnu-ld > toolchain/ld-path
        
        echo "Toolchain installed:"
        aarch64-linux-gnu-gcc --version | head -1
    
    - name: Verify toolchain
      run: |
        echo "Verifying toolchain..."
        TOOLCHAIN_PATH=$(cat toolchain/gcc-path)
        echo "GCC path: $TOOLCHAIN_PATH"
        $TOOLCHAIN_PATH --version | head -1

  # ============================================
  # Stage 3: Dependencies Setup (Cached)
  # ============================================
  dependencies:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Cache build dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.npm
        key: ${{ env.DEPS_CACHE_KEY }}
        restore-keys: |
          deps-${{ runner.os }}-
    
    - name: Install dependencies (if not cached)
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          python3 \
          python3-pip \
          git \
          cpio \
          zip \
          unzip \
          pigz \
          zstd \
          lz4 \
          xz-utils \
          device-tree-compiler
        
        # Install Python packages
        pip3 install --user pyelftools
        
        # Save dependency state
        echo "Dependencies installed successfully"

  # ============================================
  # Stage 4: Kernel Source (Cached)
  # ============================================
  kernel-source:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Cache kernel source
      id: cache-source
      uses: actions/cache@v4
      with:
        path: kernel-source
        key: kernel-source-${{ env.KERNEL_VERSION }}-${{ hashFiles('arch/arm64/configs/*.defconfig') }}
        restore-keys: |
          kernel-source-${{ env.KERNEL_VERSION }}-
          kernel-source-
    
    - name: Clone kernel source (if not cached)
      if: steps.cache-source.outputs.cache-hit != 'true'
      run: |
        echo "Cloning kernel source..."
        git clone --depth=1 https://github.com/maverickjb/linux-6.1.10.git kernel-source
        echo "Kernel source cloned"
    
    - name: Verify kernel source
      run: |
        echo "Verifying kernel source..."
        ls -la kernel-source/
        ls kernel-source/arch/arm64/configs/ | head -10

  # ============================================
  # Stage 5: Build Kernel (Main Build Job)
  # ============================================
  build:
    runs-on: ubuntu-latest
    needs: [setup, toolchain, dependencies, kernel-source]
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Restore cached kernel source
      uses: actions/cache@v4
      with:
        path: kernel-source
        key: kernel-source-${{ env.KERNEL_VERSION }}-${{ hashFiles('arch/arm64/configs/*.defconfig') }}
        restore-keys: |
          kernel-source-${{ env.KERNEL_VERSION }}-
          kernel-source-
    
    - name: Restore cached toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: ${{ env.TOOLCHAIN_CACHE_KEY }}
        restore-keys: |
          toolchain-${{ runner.os }}-
    
    - name: Restore cached dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.npm
        key: ${{ env.DEPS_CACHE_KEY }}
        restore-keys: |
          deps-${{ runner.os }}-
    
    - name: Setup build environment
      run: |
        # Install additional dependencies
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          python3 \
          python3-pip \
          git \
          cpio \
          zip \
          unzip \
          pigz \
          zstd \
          lz4 \
          xz-utils \
          device-tree-compiler
        
        pip3 install --user pyelftools
        
        # Setup paths
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        
        # Verify toolchain
        which aarch64-linux-gnu-gcc
        aarch64-linux-gnu-gcc --version | head -1
    
    - name: Prepare kernel source
      run: |
        echo "Preparing kernel source..."
        
        # Check if kernel source exists
        if [ ! -d "kernel-source" ]; then
          echo "Error: kernel-source directory not found"
          exit 1
        fi
        
        # Link kernel source to build directory
        ln -sf kernel-source kernel
        ls -la kernel/
    
    - name: Apply DroidSpaces kernel config
      run: |
        cd kernel
        echo "Applying DroidSpaces kernel configuration..."
        
        # Create defconfig with DroidSpaces support
        cat > arch/arm64/configs/${{ env.DEFCONFIG }} << 'DEFCONFIG_EOF'
        # Base config for Xiaomi Pad 5 (nabu)
        CONFIG_LOCALVERSION="-droidspace"
        CONFIG_MODULES=y
        CONFIG_MODULE_UNLOAD=y
        
        # ARM64 Architecture
        CONFIG_ARCH_SM8150=y
        CONFIG_ARCH_XIAOMI=y
        CONFIG_SCHED_MC=y
        CONFIG_NR_CPUS=8
        
        # Enable Namespaces for container support
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y
        CONFIG_CGROUP_NS=y
        
        # Cgroup support
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CPUSETS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_MEMCG=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_RDMA=y
        CONFIG_CGROUP_PERF=y
        CONFIG_CGROUP_HUGETLB=y
        CONFIG_CGROUP_WRITEBACK=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_SCPS=y
        CONFIG_CGROUP_FAVORDYNQ=y
        
        # OverlayFS support
        CONFIG_OVERLAY_FS=y
        CONFIG_OVERLAY_FS_REDIRECT_DIR=y
        CONFIG_OVERLAY_FS_INDEX=y
        CONFIG_OVERLAY_FS_METACOPY=y
        
        # Filesystem support
        CONFIG_EXT4_FS=y
        CONFIG_EXT4_FS_POSIX_ACL=y
        CONFIG_EXT4_FS_SECURITY=y
        CONFIG_BTRFS_FS=y
        CONFIG_BTRFS_FS_POSIX_ACL=y
        CONFIG_XFS_FS=y
        CONFIG_XFS_POSIX_ACL=y
        CONFIG_TMPFS=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TMPFS_XATTR=y
        
        # Network support
        CONFIG_NET=y
        CONFIG_INET=y
        CONFIG_IPV6=y
        CONFIG_BRIDGE=y
        CONFIG_VLAN_8021Q=y
        CONFIG_VETH=y
        CONFIG_MACVLAN=y
        CONFIG_DUMMY=y
        CONFIG_TUN=y
        
        # Device drivers
        CONFIG_BLK_DEV_LOOP=y
        CONFIG_BLK_DEV_NBD=y
        CONFIG_BLK_DEV_RAM=y
        CONFIG_BLK_DEV_RAM_SIZE=65536
        
        # Security modules
        CONFIG_SECURITY=y
        CONFIG_SECURITY_NETWORK=y
        CONFIG_DEFAULT_SECURITY_DAC=y
        
        # Android specific
        CONFIG_ANDROID=y
        CONFIG_ANDROID_BINDER_IPC=y
        CONFIG_ANDROID_BINDERFS=y
        CONFIG_ASHMEM=y
        
        # Kernel debugging (optional)
        CONFIG_DEBUG_INFO=y
        CONFIG_DEBUG_INFO_DWARF5=y
        
        # Compiler optimizations
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_SIZE=n
        
        # General
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_AUDIT=y
        CONFIG_NO_HZ=y
        CONFIG_HIGH_RES_TIMERS=y
        CONFIG_PREEMPT=y
        CONFIG_HZ_300=y
        CONFIG_HZ=300
        CONFIG_BASE_FULL=y
        CONFIG_FUTEX=y
        CONFIG_EPOLL=y
        CONFIG_SIGNALFD=y
        CONFIG_TIMERFD=y
        CONFIG_EVENTFD=y
        CONFIG_SHMEM=y
        CONFIG_AIO=y
        CONFIG_INOTIFY_USER=y
        CONFIG_QUOTA=y
        CONFIG_QUOTA_NETLINK_INTERFACE=y
        CONFIG_PRINTK=y
        CONFIG_BUG=y
        CONFIG_ELF_CORE=y
        DEFCONFIG_EOF
        
        # Generate base config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ env.DEFCONFIG }}
        
        # Verify critical config options
        echo "Verifying DroidSpaces required configs..."
        grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS" .config || true
    
    - name: Compile kernel
      run: |
        cd kernel
        echo "Compiling kernel with DroidSpaces support..."
        
        # Set compiler flags
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Build kernel image
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          Image modules dtbs 2>&1 | tee ../kernel_build.log
        
        # Check build status
        if [ $? -eq 0 ]; then
          echo "Kernel build successful!"
        else
          echo "Kernel build failed!"
          tail -50 ../kernel_build.log
          exit 1
        fi
    
    - name: Package kernel
      run: |
        cd kernel
        echo "Packaging kernel and modules..."
        
        # Create output directory
        mkdir -p ../out
        
        # Copy kernel image
        cp arch/arm64/boot/Image ../out/Image
        cp arch/arm64/boot/dts/qcom/sm8150-xiaomi-nabu.dtb ../out/ || true
        cp arch/arm64/boot/dts/qcom/sm8150-xiaomi-nabu*.dtb ../out/ || true
        
        # Install modules
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          INSTALL_MOD_PATH=../out/modules \
          modules_install
        
        # Create kernel archive
        cd ..
        tar -czf kernel-droidspace-${{ env.DEVICE }}-$(date +%Y%m%d).tar.gz \
          -C out Image \
          -C out modules \
          -C out *.dtb 2>/dev/null || true
        
        echo "Kernel package created: kernel-droidspace-${{ env.DEVICE }}-$(date +%Y%m%d).tar.gz"
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          kernel/
          out/
          *.tar.gz
        key: build-artifacts-${{ github.sha }}
        restore-keys: |
          build-artifacts-
    
    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-droidspace-${{ env.DEVICE }}-${{ github.sha }}
        path: |
          out/Image
          out/*.dtb
          out/modules/
          *.tar.gz
        retention-days: 30

  # ============================================
  # Stage 6: Create AnyKernel3 Package
  # ============================================
  package:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download kernel artifact
      uses: actions/download-artifact@v4
      with:
        name: kernel-droidspace-${{ env.DEVICE }}-${{ github.sha }}
        path: kernel-output
    
    - name: Create AnyKernel3 package
      run: |
        echo "Creating AnyKernel3 package..."
        
        # Create package directory
        PACKAGE_DIR="DroidSpaces_nabu_$(date +%Y%m%d)"
        mkdir -p "$PACKAGE_DIR"
        
        # Copy AnyKernel3 files
        cp -r AnyKernel3/* "$PACKAGE_DIR/"
        
        # Copy kernel files
        cp kernel-output/Image "$PACKAGE_DIR/"
        if [ -d kernel-output/modules ]; then
          mkdir -p "$PACKAGE_DIR/modules"
          cp -r kernel-output/modules/lib/modules/* "$PACKAGE_DIR/modules/" 2>/dev/null || true
        fi
        
        # Copy DTB files
        for dtb in kernel-output/*.dtb; do
          if [ -f "$dtb" ]; then
            cp "$dtb" "$PACKAGE_DIR/"
          fi
        done
        
        # Create zip
        cd "$PACKAGE_DIR"
        zip -r "../DroidSpaces_nabu_$(date +%Y%m%d).zip" .
        cd ..
        
        echo "AnyKernel3 package created"
    
    - name: Upload AnyKernel3 package
      uses: actions/upload-artifact@v4
      with:
        name: anykernel3-package-${{ github.sha }}
        path: "*.zip"
        retention-days: 30

  # ============================================
  # Stage 7: Test and Verify
  # ============================================
  test:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Download AnyKernel3 package
      uses: actions/download-artifact@v4
      with:
        name: anykernel3-package-${{ github.sha }}
        path: package
    
    - name: Verify package
      run: |
        echo "Verifying AnyKernel3 package..."
        
        # Check package contents
        cd package
        unzip -l *.zip
        
        # Verify kernel image exists
        if unzip -l *.zip | grep -q "Image"; then
          echo "✓ Kernel image found in package"
        else
          echo "✗ Kernel image not found in package"
          exit 1
        fi
        
        echo "Package verification passed"

  # ============================================
  # Stage 8: Release (Tag Push)
  # ============================================
  release:
    runs-on: ubuntu-latest
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/kernel-droidspace-nabu-*/*
          artifacts/anykernel3-package-*/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Stage 9: Cleanup (Optional)
  # ============================================
  cleanup:
    runs-on: ubuntu-latest
    needs: [build, package, release]
    if: always()
    
    steps:
    - name: Cleanup old cache entries
      uses: actions/github-script@v7
      with:
        script: |
          // Cleanup old cache entries older than 7 days
          const caches = await github.rest.actions.getActionsCacheList({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
          
          for (const cache of caches.data.actions_caches) {
            const createdAt = new Date(cache.created_at);
            if (createdAt < sevenDaysAgo) {
              console.log(`Deleting old cache: ${cache.key}`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
          }

  # ============================================
  # Notify
  # ============================================
  notify:
    runs-on: ubuntu-latest
    needs: [build, package, release]
    if: always()
    
    steps:
    - name: Notify build status
      run: |
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ Kernel build completed successfully!"
          echo "Device: Xiaomi Pad 5 (nabu)"
          echo "Kernel version: ${{ env.KERNEL_VERSION }}"
          echo "Features: DroidSpaces container support"
          echo ""
          echo "Build cache will be reused for future builds."
        else
          echo "❌ Kernel build failed!"
          echo "Check the build logs for details."
        fi