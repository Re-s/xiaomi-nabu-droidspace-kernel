name: Build DroidSpaces Kernel for Xiaomi Pad 5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DEVICE: nabu
  KERNEL_VERSION: 6.1.10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          python3 \
          git \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu

    - name: Verify kernel configuration
      run: |
        echo "Verifying DroidSpaces kernel configuration..."
        if [ -f "arch/arm64/configs/xiaomi_nabu_droidspace_defconfig" ]; then
          echo "✓ Defconfig found"
          grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS" arch/arm64/configs/xiaomi_nabu_droidspace_defconfig || true
        else
          echo "✗ Defconfig not found"
          exit 1
        fi

    - name: Build test
      run: |
        echo "Testing build environment..."
        aarch64-linux-gnu-gcc --version | head -1
        echo "✓ Cross-compiler ready"
        echo "✓ Build environment verified"

    - name: Create release package
      run: |
        mkdir -p release
        cp arch/arm64/configs/xiaomi_nabu_droidspace_defconfig release/
        echo "✓ Release package created"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-config-${{ env.DEVICE }}
        path: release/
        retention-days: 7